application:
  name: web_data_collector
  log_level: info
  log_file: "logs/app.log"

source:
  url: "https://books.toscrape.com/catalogue/category/books/mystery_3/index.html"
  timeout: 15
  max_pages: 3
  request_delay: 0.5
  user_agent: "web_data_collector/1.0 (educational lab)"

selectors:
  item: "article.product_pod"
  next_page: "li.next a"
  fields:
    title:
      selector: "h3 a"
      attribute: "title"
      required: true
    price:
      selector: ".price_color"
      normalize: price
      required: true
    rating:
      selector: "p.star-rating"
      attribute: "class"
      normalize: rating
    availability:
      selector: ".availability"
    category:
      selector: ".page-header h1"
      scope: page
    url:
      selector: "h3 a"
      attribute: "href"
      normalize: url
      required: true
      readonly: true
    image_url:
      selector: ".image_container img"
      attribute: "src"
      normalize: url

database:
  adapter: sqlite
  path: "data/items.sqlite3"
  table: items
  unique_key: url

output:
  directory: "output"
  format: json
  filename: "items"
